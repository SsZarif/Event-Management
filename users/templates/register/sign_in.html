<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-200">
    <div class="w-full max-w-lg bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-2xl font-semibold text-center text-white bg-gradient-to-r from-pink-500 to-blue-500 py-4 rounded-t-lg">
            Sign In
        </h2>
        <form>
            <!-- Email -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Email</label>
                <input type="email"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium">Password</label>
                <input type="password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Enter your password" required>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center mb-4">
                <input type="checkbox" id="remember-me" class="w-4 h-4 text-blue-500">
                <label for="remember-me" class="ml-2 text-gray-700">Remember me</label>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-2 text-lg font-semibold text-white bg-gradient-to-r from-pink-500 to-blue-500 rounded-lg hover:opacity-90 transition">
                Sign In
            </button>

            <!-- Forgot Password? -->
            <p class="text-center mt-4 text-gray-700">Forgot password? <a href="#"
                    class="text-blue-500 hover:underline">Click here</a></p>

            <!-- Don't have an account? -->
            <p class="text-center mt-4 text-gray-700">Don't have an account? <a href="{% url 'sign_up' %}"
                    class="text-blue-500 hover:underline">Sign up</a></p>
        </form>
    </div>
</body>

</html>
