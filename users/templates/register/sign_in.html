<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-100 to-gray-300">
    <div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8 m-4 backdrop-blur-sm bg-opacity-90">
        <!-- Header Section -->
        <div class="mb-8">
            <h2
                class="text-3xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-500">
                Welcome Back
            </h2>
            <p class="text-center text-gray-500 mt-2">Sign in to continue</p>
        </div>

        <!-- Error Messages -->
        {% if form.errors %}
        <div class="mb-6 p-4 text-red-600 bg-red-50 border border-red-200 rounded-xl flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div class="text-sm">
                Please enter a correct username and password.
            </div>
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <!-- Username/Email -->
            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Username</label>
                <div class="relative">
                    {{ form.username }}
                </div>
            </div>

            <!-- Password -->
            <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700">Password</label>
                <div class="relative">
                    {{ form.password }}
                </div>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center justify-between">
                <label class="flex items-center space-x-2 cursor-pointer">
                    {{ form.remember_me }}
                    <span class="text-sm text-gray-600">Remember me</span>
                </label>
                <a href="#" class="text-sm text-purple-600 hover:text-purple-700 transition-colors">
                    Forgot password?
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-3.5 font-semibold text-white bg-gradient-to-r from-purple-600 to-blue-500 rounded-xl hover:shadow-lg transition-all duration-300 transform hover:scale-[1.01]">
                Sign In
            </button>

            <!-- Sign Up Link -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account?
                <a href="{% url 'sign_up' %}"
                    class="font-semibold text-purple-600 hover:text-purple-700 transition-colors">
                    Sign up now
                </a>
            </p>
        </form>
    </div>
</body>

</html>
